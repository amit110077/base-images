# Builds ghcr.io/<owner>/base/debezium-connect-protobuf: the mirrored Debezium Connect 3.1 (by digest) plus the Apicurio 2.6.2 Protobuf serde, from debezium-connect-protobuf/Dockerfile, linux/amd64, and prints its digest. Started by hand (Cowork, for AVA S-28). Nothing of AVA is in it.
{"name":"build-debezium-connect-protobuf","on":{"workflow_dispatch":null},"permissions":{"contents":"read","packages":"write"},"concurrency":{"group":"build-debezium-connect-protobuf","cancel-in-progress":false},"jobs":{"build":{"runs-on":"ubuntu-24.04","timeout-minutes":20,"steps":[{"uses":"actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"},{"name":"Log in to ghcr.io with this run's token","run":"echo \"${{ github.token }}\" | docker login ghcr.io -u \"${{ github.actor }}\" --password-stdin"},{"name":"Build the Debezium Connect + Apicurio Protobuf layer (linux/amd64), push, record the digest","env":{"OWNER":"${{ github.repository_owner }}"},"run":"set -euo pipefail\ndst=\"ghcr.io/${OWNER,,}/base/debezium-connect-protobuf:3.1-apicurio2.6.2\"\ndocker build --platform linux/amd64 -t \"$dst\" debezium-connect-protobuf\ndocker run --rm --platform linux/amd64 --entrypoint sh \"$dst\" -c 'ls /kafka/external_libs/apicurio | grep -i protobuf'\ndocker push -q \"$dst\"\nd=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \"$dst\" | grep '@' | head -n 1 | sed 's/.*@//')\necho \"$dst@$d\"\necho \"### Built image (pin this digest)\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"ghcr.io/${OWNER,,}/base/debezium-connect-protobuf@$d\" >> \"$GITHUB_STEP_SUMMARY\""},{"if":"always()","run":"docker logout ghcr.io"}]}}}
