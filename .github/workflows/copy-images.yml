# Copies standard public container images (byte-identical) to ghcr.io/<owner>/base, linux/amd64, and prints their digests. Started by hand.
{"name": "copy-images", "on": {"workflow_dispatch": null}, "permissions": {"contents": "read", "packages": "write"}, "concurrency": {"group": "copy-images", "cancel-in-progress": false}, "jobs": {"copy": {"runs-on": "ubuntu-24.04", "timeout-minutes": 15, "steps": [{"name": "Log in to ghcr.io with this run's token", "run": "echo \"${{ github.token }}\" | docker login ghcr.io -u \"${{ github.actor }}\" --password-stdin"}, {"name": "Copy standard public images (linux/amd64) and record digests", "env": {"OWNER": "${{ github.repository_owner }}"}, "run": "set -euo pipefail\ndst=\"ghcr.io/${OWNER,,}/base\"\necho \"### Copied images (pin these digests)\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| image | copy | digest |\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"|---|---|---|\" >> \"$GITHUB_STEP_SUMMARY\"\nfor pair in \"docker.io/library/postgres:17 postgres:17\" \"quay.io/keycloak/keycloak:26.0 keycloak:26.0\" \"docker.io/valkey/valkey:8 valkey:8\" \"docker.io/library/eclipse-temurin:25-jre eclipse-temurin:25-jre\" \"docker.io/library/alpine:3 alpine:3\" \"docker.io/testcontainers/ryuk:0.12.0 ryuk:0.12.0\" \"docker.io/temporalio/temporal:1.6.2 temporal:1.6.2\"; do\n  set -- $pair; src=$1; name=$2\n  for n in 1 2 3; do docker pull -q --platform linux/amd64 \"$src\" && break; sleep 15; done\n  docker tag \"$src\" \"$dst/$name\"\n  docker push -q \"$dst/$name\"\n  d=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \"$dst/$name\" | grep \"^$dst/${name%%:*}@\" | sed 's/.*@//')\n  echo \"$src -> $dst/$name@$d\"\n  echo \"| $src | $dst/$name | $d |\" >> \"$GITHUB_STEP_SUMMARY\"\ndone"}, {"if": "always()", "run": "docker logout ghcr.io"}]}}}
